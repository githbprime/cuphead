<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Cuphead</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        background-color: #000000;
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: "Courier New", Courier, monospace;
        color: #ffffff;
      }
      #gameContainer {
        width: 100vw !important;
        height: 100vh !important;
      }
      canvas {
        width: 100% !important;
        height: 100% !important;
      }

      /* Fullscreen Loading Overlay */
      #loading-screen {
        position: fixed;
        inset: 0;
        background-color: #000000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        z-index: 9999;
        font-family: "Courier New", Courier, monospace;
        color: #ffffff;
      }

      #loading-text {
        font-size: 42px;
        font-weight: bold;
        color: #ffffff;
        letter-spacing: 2px;
        margin-bottom: 24px;
        text-align: center;
        min-width: 280px;
      }

      /* Detailed Status Bar Container */
      #status-container {
        width: min(720px, 92vw);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      #status-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 14px;
        color: #ffffff;
        gap: 12px;
      }

      #unity-api-status {
        font-weight: bold;
        word-break: break-word;
      }

      #unity-api-percent {
        white-space: nowrap;
        font-weight: bold;
      }

      #progress-track {
        width: 100%;
        height: 22px;
        border: 2px solid #ffffff;
        background-color: #0a0a0a;
        padding: 2px;
      }

      #progress-fill {
        width: 0%;
        height: 100%;
        background-color: #ffffff;
        transition: width 0.15s linear;
      }

      #progress-track.has-error {
        border-color: #ff4d4d;
      }

      #progress-track.has-error #progress-fill {
        background-color: #ff4d4d;
      }

      #sub-status {
        font-size: 12px;
        color: #cccccc;
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }

      /* Detailed Log & Error Output */
      #status-log {
        margin-top: 6px;
        width: 100%;
        height: 180px;
        background-color: #080808;
        border: 1px solid #444444;
        padding: 10px;
        overflow-y: auto;
        font-size: 12px;
        line-height: 1.45;
        color: #d4d4d4;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .log-entry {
        margin-bottom: 3px;
      }

      .log-info {
        color: #d4d4d4;
      }

      .log-warn {
        color: #ffd166;
      }

      .log-error {
        color: #ff4d4d;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div id="loading-text">LOADING.</div>

      <div id="status-container">
        <div id="status-header">
          <span id="unity-api-status">Initializing Unity WebGL loader...</span>
          <span id="unity-api-percent">0.0% (0.00)</span>
        </div>

        <div id="progress-track">
          <div id="progress-fill"></div>
        </div>

        <div id="sub-status">
          <span id="sub-status-left">Stage: Asset Preload</span>
          <span id="sub-status-right">0.00 MB / 2101.31 MB</span>
        </div>

        <div id="status-log" aria-live="polite"></div>
      </div>
    </div>

    <div id="gameContainer"></div>

    <script>
      const loadingScreen = document.getElementById("loading-screen");
      const loadingText = document.getElementById("loading-text");
      const unityApiStatus = document.getElementById("unity-api-status");
      const unityApiPercent = document.getElementById("unity-api-percent");
      const progressTrack = document.getElementById("progress-track");
      const progressFill = document.getElementById("progress-fill");
      const subStatusLeft = document.getElementById("sub-status-left");
      const subStatusRight = document.getElementById("sub-status-right");
      const statusLog = document.getElementById("status-log");

      let hasFatalError = false;

      // Alternate between "LOADING.", "LOADING..", and "LOADING..."
      const loadingFrames = ["LOADING.", "LOADING..", "LOADING..."];
      let frameIndex = 0;
      const loadingAnimInterval = setInterval(() => {
        frameIndex = (frameIndex + 1) % loadingFrames.length;
        loadingText.textContent = loadingFrames[frameIndex];
      }, 450);

      function timestamp() {
        return new Date().toISOString().split("T")[1].replace("Z", "");
      }

      function logStatus(message, level = "info") {
        const entry = document.createElement("div");
        entry.className = `log-entry log-${level}`;
        entry.textContent = `[${timestamp()}] ${message}`;
        statusLog.appendChild(entry);
        statusLog.scrollTop = statusLog.scrollHeight;
      }

      function reportError(source, error) {
        const detail = error instanceof Error
          ? `${error.message}${error.stack ? "\n" + error.stack : ""}`
          : String(error);
        logStatus(`[ERROR][${source}] ${detail}`, "error");
        progressTrack.classList.add("has-error");
        unityApiStatus.style.color = "#ff4d4d";
      }

      function setUnityProgress(progressFloat, statusLabel, stageText, transferText) {
        const clamped = Math.max(0, Math.min(1, progressFloat));
        const pct = (clamped * 100).toFixed(1);
        progressFill.style.width = `${pct}%`;
        unityApiStatus.textContent = statusLabel;
        unityApiPercent.textContent = `${pct}% (${clamped.toFixed(2)})`;
        if (stageText !== undefined) subStatusLeft.textContent = stageText;
        if (transferText !== undefined) subStatusRight.textContent = transferText;
      }

      window.addEventListener("error", (event) => {
        hasFatalError = true;
        reportError("WindowError", event.error || `${event.message} (${event.filename}:${event.lineno})`);
      });

      window.addEventListener("unhandledrejection", (event) => {
        hasFatalError = true;
        reportError("UnhandledPromise", event.reason || "Unhandled promise rejection");
      });

      const originalConsoleError = console.error;
      console.error = function (...args) {
        reportError("ConsoleError", args.map(a => (typeof a === "object" ? JSON.stringify(a) : String(a))).join(" "));
        originalConsoleError.apply(console, args);
      };
    </script>

    <script
      src="Build/UnityLoader.js"
      onerror="hasFatalError = true; reportError('ScriptLoad', 'Failed to load ' + new URL('Build/UnityLoader.js', document.baseURI).href);"
    ></script>

    <script>
      const EXPECTED_TOTAL_MB = 2101.31;
      const EXPECTED_TOTAL_BYTES = EXPECTED_TOTAL_MB * 1024 * 1024;
      const TOTAL_PARTS = 103 + 2 + 3; // 108 total split chunks
      const MAX_CONCURRENT_DOWNLOADS = 6;
      let loadedBytes = 0;
      let completedParts = 0;

      function updateDownloadProgress(currentFile) {
        const mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
        const totalMbDisplay = Math.max(EXPECTED_TOTAL_MB, parseFloat(mbDone)).toFixed(2);
        const rawRatio = Math.min(1, loadedBytes / EXPECTED_TOTAL_BYTES);
        const mappedProgress = rawRatio * 0.75;

        setUnityProgress(
          mappedProgress,
          `Downloading... (${mbDone} MB / ${totalMbDisplay} MB)`,
          `Stage: Fetching Build Parts (${completedParts}/${TOTAL_PARTS}) — ${currentFile}`,
          `${mbDone} MB / ${totalMbDisplay} MB`
        );
      }

      async function fetchWithProgress(url, retries = 2) {
        const resolvedUrl = new URL(url, document.baseURI).href;

        for (let attempt = 0; attempt <= retries; attempt++) {
          let attemptBytes = 0;
          try {
            const response = await fetch(resolvedUrl);
            if (!response.ok) {
              throw new Error(`HTTP ${response.status} (${response.statusText}) while fetching ${resolvedUrl}`);
            }

            if (!response.body) {
              const buffer = await response.arrayBuffer();
              loadedBytes += buffer.byteLength;
              completedParts++;
              updateDownloadProgress(url);
              return buffer;
            }

            const reader = response.body.getReader();
            const chunks = [];

            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              attemptBytes += value.length;
              loadedBytes += value.length;
              chunks.push(value);
              updateDownloadProgress(url);
            }

            completedParts++;
            updateDownloadProgress(url);

            const fullBuffer = new Uint8Array(attemptBytes);
            let offset = 0;
            for (const chunk of chunks) {
              fullBuffer.set(chunk, offset);
              offset += chunk.length;
            }
            return fullBuffer.buffer;
          } catch (err) {
            // Roll back partial bytes from a failed attempt before retrying
            loadedBytes = Math.max(0, loadedBytes - attemptBytes);
            if (attempt < retries) {
              logStatus(`Retrying ${url} (attempt ${attempt + 2}/${retries + 1}): ${err.message}`, "warn");
              await new Promise((r) => setTimeout(r, 500 * (attempt + 1)));
            } else {
              throw new Error(`Failed to fetch ${resolvedUrl}: ${err.message}`);
            }
          }
        }
      }

      async function mapWithConcurrency(items, limit, worker) {
        const results = new Array(items.length);
        let nextIndex = 0;

        async function runWorker() {
          while (nextIndex < items.length) {
            const currentIndex = nextIndex++;
            results[currentIndex] = await worker(items[currentIndex], currentIndex);
          }
        }

        const workers = Array.from({ length: Math.min(limit, items.length) }, () => runWorker());
        await Promise.all(workers);
        return results;
      }

      async function mergeFiles(fileParts, cacheKey) {
        let cache = null;
        try {
          if ("caches" in window) {
            cache = await caches.open("cuphead-cache");
            const cachedResponse = await cache.match(cacheKey);
            if (cachedResponse) {
              const blob = await cachedResponse.blob();
              loadedBytes += blob.size;
              completedParts += fileParts.length;
              logStatus(`Cache hit for ${cacheKey} (${(blob.size / (1024 * 1024)).toFixed(2)} MB)`);
              updateDownloadProgress(cacheKey);
              return URL.createObjectURL(blob);
            }
          }
        } catch (cacheReadErr) {
          reportError("CacheRead", `Could not read ${cacheKey} from cache: ${cacheReadErr.message}`);
        }

        logStatus(`Downloading ${fileParts.length} part(s) for ${cacheKey}...`);
        const buffers = await mapWithConcurrency(
          fileParts,
          MAX_CONCURRENT_DOWNLOADS,
          (part) => fetchWithProgress(part)
        );

        logStatus(`Merging ${buffers.length} buffer(s) into ${cacheKey}...`);
        const mergedBlob = new Blob(buffers);

        if (cache) {
          try {
            await cache.put(cacheKey, new Response(mergedBlob));
            logStatus(`Cached ${cacheKey} (${(mergedBlob.size / (1024 * 1024)).toFixed(2)} MB)`);
          } catch (cacheWriteErr) {
            logStatus(`[CacheWarning] Failed to store ${cacheKey} in Cache API: ${cacheWriteErr.message}`, "warn");
          }
        }

        return URL.createObjectURL(mergedBlob);
      }

      function getParts(file, start, end) {
        const parts = [];
        for (let i = start; i <= end; i++) {
          parts.push(`${file}.part${i}`);
        }
        return parts;
      }

      function hideLoadingScreen() {
        if (hasFatalError) {
          logStatus("Loading screen kept visible because errors were recorded.", "warn");
          return;
        }
        clearInterval(loadingAnimInterval);
        loadingScreen.style.display = "none";
      }

      (async () => {
        try {
          logStatus(`Base URI: ${document.baseURI}`);
          logStatus("Starting Unity WebGL asset preloader...");

          const [dataUrl, wasmUrl, asmUrl] = await Promise.all([
            mergeFiles(getParts("Build/CupheadPort.data.unityweb", 1, 103), "CupheadPort.data.unityweb"),
            mergeFiles(getParts("Build/CupheadPort.wasm.code.unityweb", 1, 2), "CupheadPort.wasm.code.unityweb"),
            mergeFiles(getParts("Build/CupheadPort.asm.code.unityweb", 1, 3), "CupheadPort.asm.code.unityweb"),
          ]);

          const originalOpen = XMLHttpRequest.prototype.open;
          XMLHttpRequest.prototype.open = function (method, url, ...rest) {
            if (typeof url === "string") {
              if (url.includes("CupheadPort.data.unityweb")) {
                url = dataUrl;
              } else if (url.includes("CupheadPort.wasm.code.unityweb")) {
                url = wasmUrl;
              } else if (url.includes("CupheadPort.asm.code.unityweb")) {
                url = asmUrl;
              }
            }
            return originalOpen.call(this, method, url, ...rest);
          };

          if (typeof UnityLoader === "undefined") {
            throw new Error("UnityLoader is undefined. Build/UnityLoader.js failed to initialize.");
          }

          if (UnityLoader.Error) {
            UnityLoader.Error.handler = function (error, message) {
              hasFatalError = true;
              reportError("UnityLoader.Error", message || error);
            };
          }

          logStatus("Calling UnityLoader.instantiate('gameContainer', 'Build/CupheadPort.json')...");
          setUnityProgress(
            0.75,
            "Downloading data... (0%)",
            "Stage: UnityLoader Instantiation",
            "Loading Build/CupheadPort.json"
          );

          let lastReportedStage = "";

          function UnityProgress(unityInstance, progress) {
            if (!unityInstance.Module) return;

            const combinedProgress = 0.75 + progress * 0.25;
            const unityPct = Math.round(progress * 100);

            if (progress < 0.9) {
              setUnityProgress(
                combinedProgress,
                `Downloading data... (${unityPct}%)`,
                `Stage: Unity WebGL Data/Code Unpack (onProgress: ${progress.toFixed(2)})`,
                `Unity Progress: ${unityPct}%`
              );
              if (lastReportedStage !== "downloading") {
                lastReportedStage = "downloading";
                logStatus("Unity WebGL API: Downloading data...");
              }
            } else if (progress < 1) {
              setUnityProgress(
                combinedProgress,
                `Preparing... (${unityPct}%)`,
                `Stage: Compiling WebAssembly & Initializing Runtime (onProgress: ${progress.toFixed(2)})`,
                `Unity Progress: ${unityPct}%`
              );
              if (lastReportedStage !== "preparing") {
                lastReportedStage = "preparing";
                logStatus("Unity WebGL API: Preparing... (Compiling WebAssembly & initializing engine)");
              }
            } else {
              setUnityProgress(
                1.0,
                "Running... (100%)",
                "Stage: Unity WebGL Runtime Ready (onProgress: 1.00)",
                "Unity Progress: 100%"
              );
              if (lastReportedStage !== "running") {
                lastReportedStage = "running";
                logStatus("Unity WebGL API: Running... (Initialization complete)");
              }
              setTimeout(hideLoadingScreen, 150);
            }
          }

          window.unityInstance = UnityLoader.instantiate(
            "gameContainer",
            "Build/CupheadPort.json",
            {
              onProgress: UnityProgress,
              Module: {
                onAbort: function (what) {
                  hasFatalError = true;
                  reportError("UnityModule.onAbort", what || "WebAssembly runtime aborted");
                },
                printErr: function (text) {
                  reportError("UnityModule.printErr", text);
                }
              }
            }
          );
        } catch (err) {
          hasFatalError = true;
          reportError("Bootstrap", err);
          unityApiStatus.textContent = "FATAL ERROR — Loading halted (see error log below)";
        }
      })();
    </script>
  </body>
</html>
