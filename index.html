<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Cuphead</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        background-color: #000000;
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: "Courier New", Courier, monospace;
        color: #ffffff;
      }
      #gameContainer {
        width: 100vw !important;
        height: 100vh !important;
      }
      canvas {
        width: 100% !important;
        height: 100% !important;
      }

      /* Fullscreen Loading Overlay */
      #loading-screen {
        position: fixed;
        inset: 0;
        background-color: #000000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        z-index: 9999;
        font-family: "Courier New", Courier, monospace;
        color: #ffffff;
      }

      #loading-text {
        font-size: 42px;
        font-weight: bold;
        color: #ffffff;
        letter-spacing: 2px;
        margin-bottom: 24px;
        text-align: center;
        min-width: 280px;
      }

      /* Detailed Status Bar Container */
      #status-container {
        width: min(760px, 92vw);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      #status-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 14px;
        color: #ffffff;
        gap: 12px;
      }

      #unity-api-status {
        font-weight: bold;
        word-break: break-word;
      }

      #unity-api-percent {
        white-space: nowrap;
        font-weight: bold;
      }

      #progress-track {
        width: 100%;
        height: 22px;
        border: 2px solid #ffffff;
        background-color: #0a0a0a;
        padding: 2px;
      }

      #progress-fill {
        width: 0%;
        height: 100%;
        background-color: #ffffff;
        transition: width 0.15s linear;
      }

      #progress-track.has-error {
        border-color: #ff4d4d;
      }

      #progress-track.has-error #progress-fill {
        background-color: #ff4d4d;
      }

      #sub-status {
        font-size: 12px;
        color: #cccccc;
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
      }

      /* Detailed Log & Error Output */
      #status-log {
        margin-top: 6px;
        width: 100%;
        height: 190px;
        background-color: #080808;
        border: 1px solid #444444;
        padding: 10px;
        overflow-y: auto;
        font-size: 12px;
        line-height: 1.45;
        color: #d4d4d4;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .log-entry {
        margin-bottom: 3px;
      }

      .log-info {
        color: #d4d4d4;
      }

      .log-warn {
        color: #ffd166;
      }

      .log-error {
        color: #ff4d4d;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div id="loading-text">LOADING.</div>

      <div id="status-container">
        <div id="status-header">
          <span id="unity-api-status">Initializing Unity WebGL loader...</span>
          <span id="unity-api-percent">0.0% (0.00)</span>
        </div>

        <div id="progress-track">
          <div id="progress-fill"></div>
        </div>

        <div id="sub-status">
          <span id="sub-status-left">Stage: Bootstrapping</span>
          <span id="sub-status-right">0.00 MB / 2101.31 MB</span>
        </div>

        <div id="status-log" aria-live="polite"></div>
      </div>
    </div>

    <div id="gameContainer"></div>

    <script>
      const loadingScreen = document.getElementById("loading-screen");
      const loadingText = document.getElementById("loading-text");
      const unityApiStatus = document.getElementById("unity-api-status");
      const unityApiPercent = document.getElementById("unity-api-percent");
      const progressTrack = document.getElementById("progress-track");
      const progressFill = document.getElementById("progress-fill");
      const subStatusLeft = document.getElementById("sub-status-left");
      const subStatusRight = document.getElementById("sub-status-right");
      const statusLog = document.getElementById("status-log");

      let hasFatalError = false;

      // Alternate between "LOADING.", "LOADING..", and "LOADING..."
      const loadingFrames = ["LOADING.", "LOADING..", "LOADING..."];
      let frameIndex = 0;
      const loadingAnimInterval = setInterval(() => {
        frameIndex = (frameIndex + 1) % loadingFrames.length;
        loadingText.textContent = loadingFrames[frameIndex];
      }, 450);

      function timestamp() {
        return new Date().toISOString().split("T")[1].replace("Z", "");
      }

      function getMemoryLabel() {
        if (performance && performance.memory) {
          const usedMB = (performance.memory.usedJSHeapSize / (1024 * 1024)).toFixed(0);
          const limitMB = (performance.memory.jsHeapSizeLimit / (1024 * 1024)).toFixed(0);
          return ` | JS Heap: ${usedMB}/${limitMB} MB`;
        }
        return "";
      }

      function logStatus(message, level = "info") {
        const entry = document.createElement("div");
        entry.className = `log-entry log-${level}`;
        entry.textContent = `[${timestamp()}] ${message}`;
        statusLog.appendChild(entry);
        statusLog.scrollTop = statusLog.scrollHeight;
      }

      function reportError(source, error) {
        const detail = error instanceof Error
          ? `${error.message}${error.stack ? "\n" + error.stack : ""}`
          : String(error);
        logStatus(`[ERROR][${source}] ${detail}`, "error");
        progressTrack.classList.add("has-error");
        unityApiStatus.style.color = "#ff4d4d";
      }

      function setUnityProgress(progressFloat, statusLabel, stageText, transferText) {
        const clamped = Math.max(0, Math.min(1, progressFloat));
        const pct = (clamped * 100).toFixed(1);
        progressFill.style.width = `${pct}%`;
        unityApiStatus.textContent = statusLabel;
        unityApiPercent.textContent = `${pct}% (${clamped.toFixed(2)})`;
        if (stageText !== undefined) subStatusLeft.textContent = stageText;
        if (transferText !== undefined) subStatusRight.textContent = transferText + getMemoryLabel();
      }

      window.addEventListener("error", (event) => {
        hasFatalError = true;
        reportError("WindowError", event.error || `${event.message} (${event.filename}:${event.lineno})`);
      });

      window.addEventListener("unhandledrejection", (event) => {
        hasFatalError = true;
        reportError("UnhandledPromise", event.reason || "Unhandled promise rejection");
      });

      const originalConsoleError = console.error;
      console.error = function (...args) {
        reportError("ConsoleError", args.map(a => (typeof a === "object" ? JSON.stringify(a) : String(a))).join(" "));
        originalConsoleError.apply(console, args);
      };
    </script>

    <script
      src="Build/UnityLoader.js"
      onerror="hasFatalError = true; reportError('ScriptLoad', 'Failed to load ' + new URL('Build/UnityLoader.js', document.baseURI).href);"
    ></script>

    <script>
      const SPLIT_ASSETS = [
        { match: "CupheadPort.data.unityweb", base: "Build/CupheadPort.data.unityweb", start: 1, end: 103 },
        { match: "CupheadPort.wasm.code.unityweb", base: "Build/CupheadPort.wasm.code.unityweb", start: 1, end: 2 },
        { match: "CupheadPort.asm.code.unityweb", base: "Build/CupheadPort.asm.code.unityweb", start: 1, end: 3 },
      ];

      const TOTAL_PARTS = SPLIT_ASSETS.reduce((sum, a) => sum + (a.end - a.start + 1), 0);
      const FALLBACK_TOTAL_BYTES = 2101.31 * 1024 * 1024;
      const STREAM_CONCURRENCY = 2; // Keep low to avoid multiple concurrent buffers in RAM
      const HEAD_CONCURRENCY = 10;

      let globalTotalBytes = FALLBACK_TOTAL_BYTES;
      let globalKnownBytes = 0;
      let globalLoadedBytes = 0;
      let globalCompletedParts = 0;

      // Holds references to completed XHR buffers so they can be freed right after Unity unpacks them
      const activeBufferReleasers = [];

      function getPartUrls(asset) {
        const urls = [];
        for (let i = asset.start; i <= asset.end; i++) {
          urls.push(new URL(`${asset.base}.part${i}`, document.baseURI).href);
        }
        return urls;
      }

      async function runPool(items, concurrency, worker) {
        const results = new Array(items.length);
        let index = 0;
        async function next() {
          while (index < items.length) {
            const i = index++;
            results[i] = await worker(items[i], i);
          }
        }
        await Promise.all(
          Array.from({ length: Math.min(concurrency, items.length) }, () => next())
        );
        return results;
      }

      async function getExactPartSizes(partUrls, assetName) {
        logStatus(`Probing exact byte sizes for ${assetName} (${partUrls.length} parts)...`);
        const sizes = await runPool(partUrls, HEAD_CONCURRENCY, async (url) => {
          const res = await fetch(url, { method: "HEAD" });
          if (!res.ok) {
            throw new Error(`HTTP ${res.status} (${res.statusText}) probing ${url}`);
          }
          const len = Number(res.headers.get("content-length"));
          if (!Number.isFinite(len) || len <= 0) {
            throw new Error(`Missing or invalid Content-Length for ${url}`);
          }
          return len;
        });

        const offsets = new Array(sizes.length);
        let total = 0;
        for (let i = 0; i < sizes.length; i++) {
          offsets[i] = total;
          total += sizes[i];
        }
        return { sizes, offsets, total };
      }

      async function streamPartIntoBuffer(url, targetView, startOffset, expectedLength, onBytesChunk, retries = 3) {
        for (let attempt = 0; attempt <= retries; attempt++) {
          let writtenInAttempt = 0;
          try {
            const response = await fetch(url);
            if (!response.ok) {
              throw new Error(`HTTP ${response.status} (${response.statusText}) fetching ${url}`);
            }

            if (!response.body) {
              const buf = new Uint8Array(await response.arrayBuffer());
              if (buf.length !== expectedLength) {
                throw new Error(`Size mismatch for ${url}: expected ${expectedLength}, got ${buf.length}`);
              }
              targetView.set(buf, startOffset);
              writtenInAttempt = buf.length;
              onBytesChunk(buf.length);
              return;
            }

            const reader = response.body.getReader();
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              if (writtenInAttempt + value.length > expectedLength) {
                throw new Error(`Overflow on ${url}: exceeded expected ${expectedLength} bytes`);
              }
              targetView.set(value, startOffset + writtenInAttempt);
              writtenInAttempt += value.length;
              onBytesChunk(value.length);
            }

            if (writtenInAttempt !== expectedLength) {
              throw new Error(`Incomplete read on ${url}: expected ${expectedLength}, got ${writtenInAttempt}`);
            }
            return;
          } catch (err) {
            if (writtenInAttempt > 0) {
              onBytesChunk(-writtenInAttempt);
            }
            if (attempt < retries) {
              logStatus(`Retrying ${url} (attempt ${attempt + 2}/${retries + 1}): ${err.message}`, "warn");
              await new Promise((r) => setTimeout(r, 600 * (attempt + 1)));
            } else {
              throw err;
            }
          }
        }
      }

      function installStreamingXHRInterceptor() {
        const NativeXHR = window.XMLHttpRequest;
        const nativeOpen = NativeXHR.prototype.open;
        const nativeSend = NativeXHR.prototype.send;
        const nativeSetRequestHeader = NativeXHR.prototype.setRequestHeader;
        const nativeOverrideMimeType = NativeXHR.prototype.overrideMimeType;
        const nativeGetResponseHeader = NativeXHR.prototype.getResponseHeader;
        const nativeGetAllResponseHeaders = NativeXHR.prototype.getAllResponseHeaders;

        NativeXHR.prototype.open = function (method, url, async = true, user, password) {
          const urlStr = typeof url === "string" ? url : String(url);
          const matchedAsset = SPLIT_ASSETS.find((a) => urlStr.includes(a.match));

          if (!matchedAsset) {
            this._splitIntercept = null;
            return nativeOpen.call(this, method, url, async, user, password);
          }

          this._splitIntercept = {
            asset: matchedAsset,
            method,
            url: new URL(urlStr, document.baseURI).href,
            readyState: 1,
            status: 0,
            statusText: "",
            response: null,
            totalBytes: 0,
          };

          const state = this._splitIntercept;
          Object.defineProperties(this, {
            readyState: { get: () => state.readyState, configurable: true },
            status: { get: () => state.status, configurable: true },
            statusText: { get: () => state.statusText, configurable: true },
            response: { get: () => state.response, configurable: true },
            responseURL: { get: () => state.url, configurable: true },
          });

          this.dispatchEvent(new Event("readystatechange"));
        };

        NativeXHR.prototype.setRequestHeader = function (name, value) {
          if (this._splitIntercept) return;
          return nativeSetRequestHeader.call(this, name, value);
        };

        NativeXHR.prototype.overrideMimeType = function (mime) {
          if (this._splitIntercept) return;
          return nativeOverrideMimeType.call(this, mime);
        };

        NativeXHR.prototype.getResponseHeader = function (name) {
          if (this._splitIntercept) {
            const lower = String(name).toLowerCase();
            if (lower === "content-length") return String(this._splitIntercept.totalBytes);
            if (lower === "content-type") return "application/octet-stream";
            return null;
          }
          return nativeGetResponseHeader.call(this, name);
        };

        NativeXHR.prototype.getAllResponseHeaders = function () {
          if (this._splitIntercept) {
            return `content-length: ${this._splitIntercept.totalBytes}\r\ncontent-type: application/octet-stream\r\n`;
          }
          return nativeGetAllResponseHeaders.call(this);
        };

        NativeXHR.prototype.send = function (body) {
          if (!this._splitIntercept) {
            return nativeSend.call(this, body);
          }

          const xhr = this;
          const state = this._splitIntercept;
          const asset = state.asset;

          (async () => {
            try {
              const partUrls = getPartUrls(asset);
              const { sizes, offsets, total } = await getExactPartSizes(partUrls, asset.match);

              state.totalBytes = total;
              globalKnownBytes += total;
              if (globalKnownBytes > globalTotalBytes) {
                globalTotalBytes = globalKnownBytes;
              }

              logStatus(`Allocating single ${(total / (1024 * 1024)).toFixed(2)} MB buffer for ${asset.match}...`);
              let singleBuffer = new Uint8Array(total);
              let assetLoadedBytes = 0;

              activeBufferReleasers.push(() => {
                singleBuffer = null;
                state.response = null;
              });

              state.readyState = 2;
              xhr.dispatchEvent(new Event("readystatechange"));
              state.readyState = 3;
              xhr.dispatchEvent(new Event("readystatechange"));

              const indices = Array.from({ length: partUrls.length }, (_, i) => i);
              await runPool(indices, STREAM_CONCURRENCY, async (partIdx) => {
                await streamPartIntoBuffer(
                  partUrls[partIdx],
                  singleBuffer,
                  offsets[partIdx],
                  sizes[partIdx],
                  (deltaBytes) => {
                    assetLoadedBytes += deltaBytes;
                    globalLoadedBytes += deltaBytes;

                    const mbDone = (globalLoadedBytes / (1024 * 1024)).toFixed(2);
                    const mbTotal = (globalTotalBytes / (1024 * 1024)).toFixed(2);
                    const ratio = Math.min(1, globalLoadedBytes / globalTotalBytes);
                    // Map streaming download across 0.00 -> 0.85 of total progress
                    const mappedProgress = ratio * 0.85;

                    setUnityProgress(
                      mappedProgress,
                      `Downloading data... (${Math.round(ratio * 100)}%)`,
                      `Stage: Streaming ${asset.match} (${globalCompletedParts}/${TOTAL_PARTS} parts)`,
                      `${mbDone} MB / ${mbTotal} MB`
                    );

                    xhr.dispatchEvent(
                      new ProgressEvent("progress", {
                        lengthComputable: true,
                        loaded: Math.max(0, assetLoadedBytes),
                        total,
                      })
                    );
                  }
                );
                globalCompletedParts++;
              });

              logStatus(`Completed streaming ${asset.match} (${(total / (1024 * 1024)).toFixed(2)} MB).`);

              state.status = 200;
              state.statusText = "OK";
              state.response = singleBuffer.buffer;
              state.readyState = 4;

              xhr.dispatchEvent(new Event("readystatechange"));
              xhr.dispatchEvent(
                new ProgressEvent("progress", {
                  lengthComputable: true,
                  loaded: total,
                  total,
                })
              );
              xhr.dispatchEvent(new Event("load"));
              xhr.dispatchEvent(new Event("loadend"));
            } catch (err) {
              hasFatalError = true;
              reportError(`StreamXHR:${asset.match}`, err);
              unityApiStatus.textContent = "FATAL ERROR — Loading halted (see error log below)";
              state.status = 0;
              state.readyState = 4;
              xhr.dispatchEvent(new Event("readystatechange"));
              xhr.dispatchEvent(new Event("error"));
              xhr.dispatchEvent(new Event("loadend"));
            }
          })();
        };
      }

      function releaseDownloadedBuffers() {
        if (activeBufferReleasers.length === 0) return;
        while (activeBufferReleasers.length > 0) {
          const release = activeBufferReleasers.pop();
          release();
        }
        logStatus("Released intermediate download buffers so browser GC can reclaim RAM.");
      }

      function hideLoadingScreen() {
        if (hasFatalError) {
          logStatus("Loading screen kept visible because errors were recorded.", "warn");
          return;
        }
        clearInterval(loadingAnimInterval);
        loadingScreen.style.display = "none";
      }

      (() => {
        try {
          if (typeof UnityLoader === "undefined") {
            throw new Error("UnityLoader is undefined. Build/UnityLoader.js failed to load.");
          }

          if (UnityLoader.Error) {
            UnityLoader.Error.handler = function (error, message) {
              hasFatalError = true;
              reportError("UnityLoader.Error", message || error);
            };
          }

          installStreamingXHRInterceptor();
          logStatus("Single-buffer streaming XHR interceptor installed.");
          logStatus("Calling UnityLoader.instantiate('gameContainer', 'Build/CupheadPort.json')...");

          let lastReportedStage = "";

          function UnityProgress(unityInstance, progress) {
            if (!unityInstance.Module) return;

            const unityPct = Math.round(progress * 100);

            if (progress < 0.9) {
              if (lastReportedStage !== "downloading") {
                lastReportedStage = "downloading";
                logStatus("Unity WebGL API: Downloading data...");
              }
            } else if (progress < 1) {
              // Unity has finished reading XHR responses and is now compiling WASM / initializing runtime
              releaseDownloadedBuffers();
              const combinedProgress = 0.85 + ((progress - 0.9) / 0.1) * 0.15;
              setUnityProgress(
                combinedProgress,
                `Preparing... (${unityPct}%)`,
                `Stage: Compiling WebAssembly & Initializing Runtime (onProgress: ${progress.toFixed(2)})`,
                `Unity Progress: ${unityPct}%`
              );
              if (lastReportedStage !== "preparing") {
                lastReportedStage = "preparing";
                logStatus("Unity WebGL API: Preparing... (Compiling WebAssembly & initializing engine)");
              }
            } else {
              releaseDownloadedBuffers();
              setUnityProgress(
                1.0,
                "Running... (100%)",
                "Stage: Unity WebGL Runtime Ready (onProgress: 1.00)",
                "Unity Progress: 100%"
              );
              if (lastReportedStage !== "running") {
                lastReportedStage = "running";
                logStatus("Unity WebGL API: Running... (Initialization complete)");
              }
              setTimeout(hideLoadingScreen, 200);
            }
          }

          window.unityInstance = UnityLoader.instantiate(
            "gameContainer",
            "Build/CupheadPort.json",
            {
              onProgress: UnityProgress,
              Module: {
                onAbort: function (what) {
                  hasFatalError = true;
                  reportError("UnityModule.onAbort", what || "WebAssembly runtime aborted");
                },
                printErr: function (text) {
                  reportError("UnityModule.printErr", text);
                },
              },
            }
          );
        } catch (err) {
          hasFatalError = true;
          reportError("Bootstrap", err);
          unityApiStatus.textContent = "FATAL ERROR — Loading halted (see error log below)";
        }
      })();
    </script>
  </body>
</html>
